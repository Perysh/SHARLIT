<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шар предсказаний</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  .ball {
    position:relative;
    aspect-ratio:533 / 672;
    height:100%; max-width:100%; max-height:100%;
    container-type:size;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .ball img { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }

  /* ДЫМ ВНУТРИ ШАРА */
  .smoke {
    position:absolute; left:50.6%; top:35%;
    width:86%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; overflow:hidden; pointer-events:none;
    opacity:.85;
    background:radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,.35) 70%, transparent);
    -webkit-mask-image:radial-gradient(circle, #000 55%, transparent 98%);
            mask-image:radial-gradient(circle, #000 55%, transparent 98%);
    filter:hue-rotate(0deg) saturate(1.1);
    transition:filter 4s ease-in-out;
  }
  .smoke.fast { transition-duration:1.2s; }
  .puff {
    position:absolute; width:70%; height:70%; border-radius:50%;
    filter:blur(7cqw); opacity:.9;
    will-change:transform;
  }
  .p1 { left:-5%; top:5%;  background:radial-gradient(circle at 40% 40%, #7fd6b0, transparent 68%); animation:d1 17s ease-in-out infinite; }
  .p2 { right:-8%; top:20%; background:radial-gradient(circle at 50% 50%, #9fb6f0, transparent 66%); animation:d2 23s ease-in-out infinite; }
  .p3 { left:15%; bottom:-10%; background:radial-gradient(circle at 50% 50%, #c9a6ee, transparent 66%); animation:d3 19s ease-in-out infinite; }
  .p4 { left:25%; top:-8%; width:55%; height:55%; background:radial-gradient(circle at 50% 50%, #b8f0d4, transparent 65%); animation:d4 29s ease-in-out infinite; }
  .p5 { left:30%; top:30%; width:45%; height:45%; background:radial-gradient(circle at 50% 50%, #e8f7a8, transparent 65%); animation:d5 13s ease-in-out infinite; }
  .swirl {
    position:absolute; inset:-20%; border-radius:50%; opacity:.55;
    background:conic-gradient(from 0deg, transparent 0 10%, #8fd9c0 25%, transparent 40% 55%, #a9a0ec 72%, transparent 88%);
    filter:blur(6cqw); animation:spin 40s linear infinite;
  }
  @keyframes d1 { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(40%,25%) scale(1.25); } 66% { transform:translate(15%,-15%) scale(.9); } }
  @keyframes d2 { 0%,100% { transform:translate(0,0) scale(1.1); } 50% { transform:translate(-45%,20%) scale(.85); } }
  @keyframes d3 { 0%,100% { transform:translate(0,0) scale(1); } 40% { transform:translate(30%,-40%) scale(1.3); } 75% { transform:translate(-25%,-10%) scale(.9); } }
  @keyframes d4 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(20%,60%) scale(1.2); } }
  @keyframes d5 { 0%,100% { transform:translate(0,0) scale(.9); } 50% { transform:translate(40%,-30%) scale(1.3); } }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ПРЕДСКАЗАНИЕ */
  .mist {
    position:absolute; left:50.6%; top:35%;
    width:56%; transform:translate(-50%,-50%);
    text-align:center;
    font-family:"Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-style:italic; font-weight:700;
    font-size:7.2cqw; line-height:1.2;
    color:#14281f;
    text-shadow:0 0 8px rgba(255,255,255,.95), 0 0 18px rgba(255,255,255,.85), 0 0 30px rgba(255,255,255,.6);
    opacity:0; filter:blur(10px); letter-spacing:.02em;
    transition:opacity .9s ease, filter .9s ease, transform .9s ease;
    pointer-events:none;
  }
  .mist.show { opacity:1; filter:blur(0); transform:translate(-50%,-50%) scale(1); }
  .mist.hide { opacity:0; filter:blur(12px); transform:translate(-50%,-50%) scale(1.08); transition-duration:.45s; }
  .mist.hint { font-size:5.6cqw; font-weight:400; color:#2d4a3c; }
</style>
</head>

    hue = (hue + 60 + Math.random() * 200) % 360;
    smoke.classList.toggle('fast', !!fast);
    smoke.style.filter = `hue-rotate(${hue}deg) saturate(${(1.1 + Math.random() * .5).toFixed(2)})`;
  }
  (function loop() {
    setTimeout(() => { shiftColor(false); loop(); }, 6000 + Math.random() * 6000);
  })();

  function predict() {
    if (busy) return;
    busy = true;
    shiftColor(true);
    mist.classList.remove('show'); mist.classList.add('hide');
    setTimeout(() => {
      mist.classList.remove('hint');
      mist.textContent = next();
      mist.classList.remove('hide');
      void mist.offsetWidth;
      mist.classList.add('show');
      busy = false;
    }, 500);
  }

  ball.addEventListener('click', predict);
  ball.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') predict(); });
</script>
</body>
</html>
